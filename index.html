<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="DON-PHILIP — Graphic design, software engineering and cybersecurity portfolio of Onyejekwe Philip Emeka."
    />

    <meta name="theme-color" content="#080b09" />

    <title>DON-PHILIP | Creative & Technology Portfolio</title>

    <script>
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
        if (t === "light") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f3f6ef");
        }
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
